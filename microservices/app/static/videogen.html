<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sora 2 Video Generator — test page</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  progress { width: 100%; margin-top: 1rem; }
  label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
  textarea, select, input { width: 100%; padding: .5rem; font: inherit; box-sizing: border-box; }
  textarea { min-height: 6rem; }
  button { margin-top: 1rem; padding: .6rem 1.2rem; font: inherit; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  fieldset { border: 0; padding: 0; margin: 0; }
  fieldset[disabled] { opacity: .6; }
  pre { background: #8881; padding: .75rem; overflow-x: auto; }
  video { width: 100%; margin-top: 1rem; background: #000; }
  .portrait video { max-width: 360px; }
  #status { margin-top: 1rem; display: flex; align-items: center; gap: .6rem; font-weight: 600; }
  #status.failed { color: #d33; }
  #script { white-space: pre-wrap; border-left: 3px solid #8886; }
  .muted { font-weight: 400; opacity: .7; }
  #script b { display: block; margin-top: .5rem; opacity: .7; font-size: .85em; }
  #extras { margin-top: .75rem; font-size: .9rem; display: flex; gap: 1rem; flex-wrap: wrap; }
  .spin {
    width: 1rem; height: 1rem; border-radius: 50%; flex: none;
    border: 2px solid #8886; border-top-color: currentColor;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
</style>
</head>
<body>
<h1>Historical video generator</h1>
<p>Pick a character to run the full pipeline — script → Sarvam voice → Sora 2 video →
FFmpeg assembly. Leave it on <em>none</em> for a plain Sora clip with Sora's own audio.
Every run is real: about <strong>$0.10 per second</strong> of video.</p>

<form id="form">
  <fieldset id="fields">
  <label for="character">Character</label>
  <select id="character">
    <option value="">none — plain Sora clip, prompt used as-is</option>
  </select>

  <div id="lang-block">
    <label for="language">Spoken language <span id="lang-hint" class="muted"></span></label>
    <select id="language"></select>

    <label for="tmodel">Translation model</label>
    <select id="tmodel">
      <option value="sarvam-translate">sarvam-translate — all 23 languages, faithful</option>
      <option value="mayura">mayura — conversational, 11 languages</option>
    </select>

    <label for="tstyle">Translation style <span class="muted">(mayura only)</span></label>
    <select id="tstyle">
      <option value="formal">formal</option>
      <option value="modern-colloquial">modern-colloquial</option>
      <option value="classic-colloquial">classic-colloquial</option>
      <option value="code-mixed">code-mixed</option>
    </select>
  </div>

  <label for="prompt">Prompt <span id="prompt-hint"></span></label>
  <textarea id="prompt" required>A 1930s Indian freedom fighter looks directly into the camera and says: "The time for waiting is over." He appears calm and resolute.</textarea>

  <label for="mode">Mode</label>
  <select id="mode">
    <option value="auto">auto (keyword router)</option>
    <option value="portrait">portrait — 720x1280 talking figure</option>
    <option value="scene">scene — 1280x720 cinematic</option>
  </select>

  <label for="seconds">Duration</label>
  <select id="seconds">
    <option value="auto" selected>auto — fit to the voice track</option>
    <option value="4">4s (~$0.40)</option>
    <option value="8">8s (~$0.80)</option>
    <option value="12">12s (~$1.20)</option>
  </select>

  <label for="image">Reference image (optional, JPG/PNG/WEBP)</label>
  <input id="image" type="file" accept=".jpg,.jpeg,.png,.webp">

  <button id="go" type="submit">Generate</button>
  </fieldset>
</form>

<div id="status" hidden></div>
<progress id="bar" max="100" hidden></progress>
<pre id="script" hidden></pre>
<div id="player"></div>
<div id="extras"></div>
<details><summary>Job JSON</summary><pre id="log">idle</pre></details>

<script>
const $ = (id) => document.getElementById(id);
const log = (o) => { $('log').textContent = typeof o === 'string' ? o : JSON.stringify(o, null, 2); };

let started = 0;
const elapsed = () => {
  const s = Math.round((Date.now() - started) / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

function status(text, { spinning = true, failed = false } = {}) {
  $('status').hidden = false;
  $('status').className = failed ? 'failed' : '';
  $('status').innerHTML = (spinning ? '<span class="spin"></span>' : '') + '<span></span>';
  $('status').lastChild.textContent = text;
}

fetch('/v1/video/characters').then((r) => r.json()).then((chars) => {
  for (const [key, name] of Object.entries(chars)) {
    $('character').add(new Option(`${name} — answers in character`, key));
  }
});

let mayuraLangs = [];
fetch('/v1/video/languages').then((r) => r.json()).then((info) => {
  mayuraLangs = info.mayura_languages;
  for (const [code, name] of Object.entries(info.languages)) {
    $('language').add(new Option(`${name} (${code})`, code));
  }
  syncTranslationControls();
});

function syncTranslationControls() {
  // translation rewrites generated dialogue, so it needs a character to speak it
  const hasCharacter = !!$('character').value;
  const translating = $('language').value !== 'en-IN';
  const mayura = $('tmodel').value === 'mayura';

  $('language').disabled = !hasCharacter;
  $('tmodel').disabled = !hasCharacter || !translating;
  $('tstyle').disabled = !hasCharacter || !translating || !mayura;  // style is mayura-only
  $('lang-hint').textContent = hasCharacter ? '' : '— pick a character first';

  const blocked = hasCharacter && translating && mayura
    && !mayuraLangs.includes($('language').value);
  $('go').disabled = blocked;
  $('prompt-hint').textContent = blocked
    ? '— mayura does not cover this language, switch to sarvam-translate'
    : (hasCharacter ? '— ask them a question' : '');
}

$('language').addEventListener('change', syncTranslationControls);
$('tmodel').addEventListener('change', syncTranslationControls);

$('character').addEventListener('change', () => {
  const on = !!$('character').value;
  if (!on) $('language').value = 'en-IN';
  $('prompt').placeholder = on
    ? 'Why did people first see you as a liberator?'
    : 'Describe the shot';
  syncTranslationControls();
});

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('fields').disabled = true;          // one run at a time
  $('player').innerHTML = '';
  $('extras').innerHTML = '';
  $('script').hidden = true;
  $('bar').hidden = false;
  $('bar').removeAttribute('value');    // indeterminate until Sora reports progress
  started = Date.now();
  status('Submitting to Sora 2…');

  const body = new FormData();
  body.append('prompt', $('prompt').value);
  body.append('mode', $('mode').value);
  body.append('seconds', $('seconds').value);
  if ($('character').value) {
    body.append('character', $('character').value);
    body.append('language', $('language').value);
    body.append('translation_model', $('tmodel').value);
    if ($('tmodel').value === 'mayura') body.append('translation_style', $('tstyle').value);
  }
  if ($('image').files[0]) body.append('reference_image', $('image').files[0]);

  try {
    const res = await fetch('/v1/video/generate', { method: 'POST', body });
    const job = await res.json();
    if (!res.ok) throw new Error(job.detail || res.statusText);
    log(job);
    await poll(job.id);
  } catch (err) {
    status('Error: ' + err.message, { spinning: false, failed: true });
    $('bar').hidden = true;
  } finally {
    $('fields').disabled = false;
    syncTranslationControls();   // fieldset re-enable must not un-block an invalid combo
  }
});

async function poll(id) {
  while (true) {
    const job = await (await fetch(`/v1/video/jobs/${id}`)).json();
    log(job);

    if (job.progress > 0) $('bar').value = job.progress;
    if (job.script) {
      $('script').hidden = false;
      $('script').textContent = job.translated_script || job.script;
      if (job.translated_script) {
        // the translated lines are what gets spoken; keep the English for reference
        const original = document.createElement('b');
        original.textContent = `English source (${job.translation_model}):\n${job.script}`;
        $('script').append(original);
      }
    }

    if (job.status === 'completed') {
      $('bar').hidden = true;
      status(`Done in ${elapsed()}`, { spinning: false });
      $('player').className = job.mode === 'portrait' ? 'portrait' : '';
      // the muxed file is the deliverable; the raw Sora clip is only a fallback
      $('player').innerHTML = `<video src="${job.final_video_url || job.video_url}" controls autoplay></video>`;
      const links = [['Sora clip', job.video_url], ['Sarvam voice', job.audio_url]]
        .filter(([, url]) => url)
        .map(([text, url]) => `<a href="${url}" target="_blank">${text}</a>`);
      if (job.timing) {
        const t = job.timing;
        links.push(`voice ${t.audio_seconds}s · clip ${t.video_seconds}s · ` +
          (t.padded_seconds ? `held ${t.padded_seconds}s` : `trimmed ${t.trimmed_seconds}s`) +
          ` → final ${t.final_seconds}s`);
      }
      const pa = job.pause_alignment;
      if (pa) {
        links.push(pa.applied
          ? `pauses realigned ${JSON.stringify(pa.was)} → ${JSON.stringify(pa.pauses)}`
          : 'pauses left as scripted (no speech runs detected in the clip)');
      }
      $('extras').innerHTML = links.join('');
      return;
    }
    if (job.status === 'failed') {
      $('bar').hidden = true;
      status(`${job.failed_stage || 'generation'}: ${job.error || 'failed'}`,
             { spinning: false, failed: true });
      return;
    }

    const pct = job.progress ? ` — ${job.progress}%` : '';
    status(`${job.message || job.status}${pct} · ${elapsed()} elapsed`);
    await new Promise((r) => setTimeout(r, 2000));
  }
}
</script>
</body>
</html>
